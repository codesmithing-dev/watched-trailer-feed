name: Refresh Recent Trailer Feed

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recent-trailer-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Generate feed
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WATCHED_GATEWAY_BASE_URL: ${{ secrets.WATCHED_GATEWAY_BASE_URL }}
        run: |
          if [[ -n "$WATCHED_GATEWAY_BASE_URL" ]]; then
            export TMDB_BASE_URL="${WATCHED_GATEWAY_BASE_URL%/}/v1/tmdb/3"
          fi
          next_feed="$(mktemp)"
          _generator/generate-recent-trailer-feed.sh \
            --previous-feed recent-trailers.json \
            >"$next_feed"
          jq -e '
            .schemaVersion == 1
            and (.generatedAt | type == "string")
            and (.trailers | type == "array")
            and (all(.trailers[]; .videoID and .tmdbID and .movieTitle and .publishedAt))
          ' "$next_feed" >/dev/null
          mv "$next_feed" recent-trailers.json

      - name: Publish feed to gateway
        env:
          WATCHED_GATEWAY_BASE_URL: ${{ secrets.WATCHED_GATEWAY_BASE_URL }}
          TRAILER_PUBLISH_TOKEN: ${{ secrets.TRAILER_PUBLISH_TOKEN }}
        run: |
          if [[ -z "$WATCHED_GATEWAY_BASE_URL" ]]; then
            echo "No gateway is configured; GitHub Pages remains the feed origin."
            exit 0
          fi
          if [[ -z "$TRAILER_PUBLISH_TOKEN" ]]; then
            echo "TRAILER_PUBLISH_TOKEN must be configured with WATCHED_GATEWAY_BASE_URL." >&2
            exit 2
          fi
          curl --fail --silent --show-error --retry 3 \
            --request PUT "${WATCHED_GATEWAY_BASE_URL%/}/v1/admin/recent-trailers" \
            --header "Authorization: Bearer $TRAILER_PUBLISH_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary '@recent-trailers.json'

      - name: Publish changed feed
        run: |
          if git diff --quiet -- recent-trailers.json; then
            echo "The generated feed is unchanged."
            exit 0
          fi
          generated_at="$(jq -r '.generatedAt' recent-trailers.json)"
          git config user.name "Watched Trailer Feed"
          git config user.email "actions@users.noreply.github.com"
          git add recent-trailers.json
          git commit -m "Publish trailer feed $generated_at"
          git push
